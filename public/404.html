<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>İthalyem.com</title>
    <!--
      GitHub Pages SPA yönlendirmesi (spa-github-pages tekniği).
      Derin URL'ler (/urunler/..., /teklif) yenilendiğinde GitHub Pages 404 verir;
      bu sayfa yolu sorgu dizesine çevirip index.html'e yönlendirir, index.html
      içindeki script de gerçek yolu geri yükler. Özel domain kökü için pathSegmentsToKeep = 0.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
