<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="1X2S_tBSSXCUqiowyg7NMcoBVJhNfDbj3k6TJyIxgaE" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Site geneli sabit meta. Sayfaya özel başlık, description, canonical,
         Open Graph, Twitter ve JSON-LD etiketleri React tarafında Seo.jsx
         (react-helmet-async) ile üretilir ve build sırasında
         scripts/prerender.mjs tarafından head yer tutucusuna yazılır. -->
    <meta name="author" content="İthalyem.com" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f3d2e" />

    <!-- Statik fallback: yalnızca dev sunucusu içindir. Build sırasında
         scripts/prerender.mjs bu bloğu tamamen kaldırır ve yerine sayfaya özel
         Helmet çıktısını koyar; böylece başlık etiketi tekrarlanmaz. -->
    <!--fallback-seo-start-->
    <title>İthalyem.com | Doğu Anadolu İthal Kepek, Pamuk Küspesi, ATK 36 & DDGS</title>
    <meta
      name="description"
      content="Orta Asya'dan Doğu Anadolu'ya %32 nişastalı ithal kepek, %22.80 proteinli pamuk yağı küspesi, ATK 36 ve DDGS tedariki. Liman ve depo teslim B2B yem ham maddesi."
    />
    <!--fallback-seo-end-->

    <!-- Structured Data: Organization (site geneli, her sayfada geçerli) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "İthalyem.com",
        "url": "https://ithalyem.com",
        "logo": "https://ithalyem.com/og-cover.png",
        "image": "https://ithalyem.com/og-cover.png",
        "description": "Orta Asya menşeli ithal yem ham maddesi tedarikçisi. Doğu Anadolu bölgesine kepek, pamuk yağı küspesi, ATK 36 ve DDGS tedariki.",
        "areaServed": "Doğu Anadolu Bölgesi, Türkiye",
        "telephone": "+90-545-133-28-59",
        "email": "info@ithalyem.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+90-545-133-28-59",
          "contactType": "sales",
          "availableLanguage": ["Turkish", "English", "Arabic"]
        }
      }
    </script>
    <!--app-head-->
  </head>
  <body>
    <!-- GitHub Pages SPA: 404.html'ten gelen ?/ yolunu gerçek route'a geri yükle. -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
